name: IR Muzyczka (Android APK)

on:
  push:
    paths:
      - 'ir-music/**'
      - '.github/workflows/ir-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ir-music
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ir-muzyczka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ir-muzyczka-apk
          path: ir-muzyczka.apk

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ir-music-latest
          name: IR Muzyczka (najnowszy build)
          body: Automatyczny build aplikacji IR Muzyczka. Pobierz ir-muzyczka.apk i zainstaluj na telefonie z diodą IR.
          prerelease: true
          make_latest: false
          files: ir-muzyczka.apk
