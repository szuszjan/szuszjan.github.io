<html lang="pl">
<head>

<title>LogicLab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:12px/1.4 "Segoe UI",Tahoma,sans-serif;color:#000;
  background:radial-gradient(ellipse at 30% 20%,#5ea0dd 0%,#2b6cb0 45%,#13407a 100%)}
#win{position:absolute;inset:6px;display:flex;flex-direction:column;border:1px solid #1d3557;border-radius:8px 8px 4px 4px;
  background:linear-gradient(#c9dcf3,#a9c5e8 30%,#b8d0ee);box-shadow:0 0 0 1px rgba(255,255,255,.55) inset,0 8px 28px rgba(0,0,0,.55);padding:0 6px 6px}
#titlebar{height:30px;display:flex;align-items:center;gap:7px;flex:none;position:relative}
#titlebar .ico{width:18px;height:18px;border-radius:4px;background:linear-gradient(#8fd0ff,#2b7fd6 55%,#1a5aa8);border:1px solid #17406e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);color:#fff;font:bold 9px/16px Consolas,monospace;text-align:center}
#titlebar .ttl{font-size:13px;text-shadow:0 0 6px #fff,0 0 3px #fff,0 0 10px #fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#caps{margin-left:auto;display:flex;margin-top:-14px;border:1px solid #2c3e57;border-top:none;border-radius:0 0 5px 5px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
#caps b{width:28px;height:19px;font-weight:normal;text-align:center;line-height:17px;font-size:13px;cursor:default;color:#1b2a40;
  background:linear-gradient(#e8eff9,#c5d5ea 48%,#a9bfdc 52%,#c7d9f0);border-right:1px solid #4a6285}
#caps b:hover{background:linear-gradient(#f4fbff,#bfe6fa 48%,#7fc6ee 52%,#b6e5fb)}
#caps b.x{width:44px;color:#fff;border-right:none;background:linear-gradient(#e9a898,#d1553f 48%,#b3200a 52%,#d85a3f);text-shadow:0 0 3px #600}
#caps b.x:hover{background:linear-gradient(#ffc7b8,#f0694e 48%,#d82a0f 52%,#ff8a63)}
#menubar{display:flex;height:23px;flex:none;background:linear-gradient(#f9fbfe,#e4ecf7);border:1px solid #9fb3cf;border-bottom:none;padding:1px 2px;gap:1px}
.mb{padding:2px 8px;border:1px solid transparent;border-radius:3px;cursor:default;line-height:17px}
.mb:hover,.mb.open{border-color:#a8d8f3;background:linear-gradient(#fdfeff,#dcebfc 48%,#c1dbf6 52%,#d3e7fb)}
.mb.open{border-color:#7da2ce;background:linear-gradient(#e3eefb,#cfe2f9)}
#toolbar{display:flex;align-items:center;gap:2px;height:30px;flex:none;padding:2px 4px;background:linear-gradient(#eef3fa,#d7e3f3 50%,#cddcf0);border:1px solid #9fb3cf;border-bottom:1px solid #8aa3c6}
.tb{height:24px;padding:0 9px;border:1px solid transparent;border-radius:3px;background:none;font:inherit;cursor:default;color:#1e2a3a;display:flex;align-items:center;gap:5px}
.tb:hover{border-color:#a8cbe6;background:linear-gradient(#fbfdff,#e3f0fc 48%,#cde4f8 52%,#dbeafa)}
.tb:active,.tb.on{border-color:#6d94bf;background:linear-gradient(#cfe0f3,#c0d6ee 48%,#a9c8e8 52%,#b9d4ee);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.sep{width:2px;height:20px;margin:0 4px;border-left:1px solid #a9bbd3;border-right:1px solid #fff}
#body{flex:1;display:flex;min-height:0;border:1px solid #8aa3c6;border-top:none;background:#fff}
.pane{background:#fff;overflow-y:auto;flex:none;display:flex;flex-direction:column}
#left{width:245px;border-right:1px solid #9fb3cf;background:linear-gradient(90deg,#fff,#f5f8fd)}
#right{width:255px;border-left:1px solid #9fb3cf;background:linear-gradient(#fff,#f3f7fc)}
.navh{padding:5px 8px;color:#1e395b;font-size:12px;background:linear-gradient(#fff,#e4ecf7);border-bottom:1px solid #cdd9ea;border-top:1px solid #fff;margin-top:4px}
.navh:first-child{margin-top:0}
.item{padding:3px 8px 3px 14px;border:1px solid transparent;margin:1px 3px;border-radius:3px;cursor:default;display:flex;justify-content:space-between;white-space:nowrap}
.item:hover{border-color:#b8d6fb;background:linear-gradient(#fafbfd,#ebf3fd)}
.item.sel{border-color:#7da2ce;background:linear-gradient(#f7fbff,#dcebfc 48%,#c2dbf6 52%,#d7e8fb)}
.item .ac{color:#7b8796}
#main{flex:1;position:relative;min-width:0;background:#10161f;border:1px solid #5d6f8a;box-shadow:inset 0 0 12px #000}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hint{position:absolute;left:10px;bottom:8px;color:#ffd23f;font-size:12px;pointer-events:none;text-shadow:0 0 6px #000}
#info{padding:10px 12px 14px}
#info h1{font-size:16px;font-weight:normal;color:#1e3a8a;margin:0 0 6px;border-bottom:1px solid #c5d3e6;padding-bottom:4px}
#info h2{font-size:12px;font-weight:normal;color:#1e395b;margin:12px 0 4px;border-bottom:1px solid #dbe5f2}

kbd{background:linear-gradient(#fff,#e1e6ee);border:1px solid #9aa7b9;border-radius:3px;padding:0 4px;font:11px Consolas,monospace;box-shadow:0 1px 0 #fff}
#status{height:22px;flex:none;display:flex;align-items:center;background:linear-gradient(#e9f0fa,#cfdcee);border:1px solid #8aa3c6;border-top:1px solid #fff;margin-top:-1px;padding:0 4px;color:#1e2a3a}
#status span{padding:0 10px;border-right:1px solid #a9bbd3;height:16px;line-height:16px;box-shadow:1px 0 0 #fff}
#status span:last-child{border:none;box-shadow:none;margin-left:auto}
#dd{position:fixed;z-index:50;display:none;min-width:200px;max-height:80vh;overflow-y:auto;padding:2px;background:linear-gradient(90deg,#f1f1f1 26px,#fff 26px);
  border:1px solid #979797;border-radius:3px;box-shadow:2px 3px 6px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.8) inset}
.mi{display:flex;align-items:center;padding:3px 24px 3px 4px;border:1px solid transparent;border-radius:3px;cursor:default;white-space:nowrap}
.mi .ck{width:22px;text-align:center;color:#1e3a8a;font-weight:bold}
.mi .ac{margin-left:auto;padding-left:26px;color:#6b7686}
.mi:hover{border-color:#7da2ce;background:linear-gradient(#f5faff,#dbeafc 48%,#c2dbf6 52%,#d5e7fb)}
.ms{height:2px;margin:3px 2px 3px 26px;border-top:1px solid #d6d6d6;border-bottom:1px solid #fff}
#dlgbg{position:fixed;inset:0;background:rgba(0,20,50,.35);display:none;align-items:center;justify-content:center;z-index:100}
#dlg{width:430px;max-width:92vw;border:1px solid #1d3557;border-radius:8px;background:linear-gradient(#c9dcf3,#a9c5e8);padding:0 6px 6px;box-shadow:0 10px 36px rgba(0,0,0,.6)}
#dlg .dt{height:28px;line-height:28px;font-size:13px;text-shadow:0 0 6px #fff,0 0 3px #fff}
#dlg .dc{background:#f0f0f0;border:1px solid #8aa3c6;padding:14px 16px}
#dlg .dc h3{margin:0 0 8px;font-weight:normal;font-size:16px;color:#1e3a8a}
#dlg .db{background:linear-gradient(#f3f3f3,#dfdfdf);border:1px solid #8aa3c6;border-top:none;padding:8px 12px;text-align:right}
.btn{min-width:78px;padding:3px 14px;font:inherit;border:1px solid #707070;border-radius:3px;color:#000;cursor:default;
  background:linear-gradient(#f2f2f2 0,#ebebeb 49%,#dddddd 50%,#cfcfcf 100%);box-shadow:0 0 0 1px rgba(255,255,255,.8) inset}
.btn:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd 0,#d9f0fc 49%,#bee6fd 50%,#a7d9f5 100%)}
.btn:active{border-color:#2c628b;background:linear-gradient(#c5e4f6,#98d1ef 49%,#68b3db 50%,#bee6fd)}
html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none}
@media (max-width:820px),(pointer:coarse){
  body{font-size:14px;background:#13407a}
  #win{inset:0;border:none;border-radius:0;box-shadow:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #titlebar{display:none}
  #menubar{height:38px;overflow-x:auto;scrollbar-width:none;flex:none}
  .mb{padding:7px 12px;white-space:nowrap}
  #toolbar{height:44px;overflow-x:auto;scrollbar-width:none;gap:4px}
  .tb{height:36px;padding:0 12px;white-space:nowrap;font-size:14px}
  #body{position:relative}
  #left,#right{position:absolute;z-index:30;top:0;bottom:0;box-shadow:0 0 18px rgba(0,0,0,.5)}
  #left{left:0;width:min(84vw,300px)}
  #right{right:0;width:min(84vw,300px)}
  .item{padding:9px 10px 9px 14px;font-size:14px}
  .mi{padding:9px 28px 9px 6px;font-size:14px}
  #status{font-size:11px;overflow:hidden;white-space:nowrap}
  #status span{padding:0 6px}
}
</style>

<body>
<div id="win">
  <div id="titlebar"><div class="ico">&amp;</div><div class="ttl">LogicLab — Symulator układów logicznych</div>
    <div id="caps"><b id="cMin">&#8211;</b><b id="cMax">&#9633;</b><b class="x" id="cX">&#10005;</b></div></div>
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="body">
    <div id="left" class="pane">
      <div class="navh">Przykłady do rozbudowy</div><div id="examples"></div>
      <div class="navh">Elementy (klawisze 1–9, 0)</div><div id="palette"></div>
    </div>
    <div id="main"><canvas id="cv"></canvas><div id="hint"></div></div>
    <div id="right" class="pane"><div class="navh">Szczegóły</div><div id="info"></div></div>
  </div>
  <div id="status"></div>
</div>
<div id="dd"></div>
<div id="dlgbg"><div id="dlg"><div class="dt" id="dlgT"></div><div class="dc" id="dlgC"></div><div class="db"><button class="btn" id="dlgOk">OK</button></div></div></div>
<script>
'use strict';
/* ================= RDZEŃ SYMULACJI (łatwy do przeniesienia na C++) ================= */
// Węzeł: {id,type,x,y,v,src:[id|null,id|null],label}
// Typy: IN BTN CLK OUT NOT AND OR XOR NAND NOR
const GATES = ['NOT','AND','OR','XOR','NAND','NOR'];
const IN_COUNT = {IN:0,BTN:0,CLK:0,OUT:1,NOT:1,AND:2,OR:2,XOR:2,NAND:2,NOR:2,SEG7:8,HEX7:4,NUM:8,MAT:20};
const SIZE = {SEG7:[100,180],HEX7:[80,100],NUM:[150,180],MAT:[220,230]};   // bloki-wyświetlacze: [szer,wys]
const CLK_PERIOD = 8;                 // przejść symulacji na połowę okresu zegara
let nodes = [], wires = [], byId = {}, nextId = 1;

function rebuild(){
  byId = {};
  for (const n of nodes){ byId[n.id] = n; n.src = new Array(IN_COUNT[n.type]||0).fill(null); }
  wires = wires.filter(w => byId[w.from] && byId[w.to] && w.pin < byId[w.to].src.length);
  for (const w of wires) byId[w.to].src[w.pin] = w.from;
}
function srcVal(n,i){ const s = n.src[i]; return s == null ? 0 : byId[s].v; }
function calc(n){
  const a = srcVal(n,0), b = srcVal(n,1);
  switch(n.type){
    case 'OUT': return a;
    case 'NOT': return a?0:1;
    case 'AND': return a&b;
    case 'OR':  return a|b;
    case 'XOR': return a^b;
    case 'NAND': return (a&b)?0:1;
    case 'NOR':  return (a|b)?0:1;
  }
  return n.v;
}
// jedno przejście: węzły aktualizowane po kolei (dzięki temu zatrzaski SR się stabilizują)
function pass(){
  for (const n of nodes){
    if (n.type==='IN'||n.type==='BTN') continue;
    if (n.type==='CLK'){ if(!n.stopped){ n.t=(n.t||0)+1; if(n.t>=CLK_PERIOD){ n.t=0; n.v^=1; } } continue; }
    n.v = calc(n);
  }
}

/* ================= PRZYKŁADY ================= */
// Każdy przykład: make(b) — b.n(nazwa,typ,x,y,etykieta) dodaje element, b.w(z,do,pin) kabel.
// Przerzutnik D wyzwalany zboczem narastającym (master-slave z NAND-ów).
function dff(b,p,x,y,d,ck){
  b.n(p+'nck','NOT',x+100,y+200); b.n(p+'nd','NOT',x+100,y+60);
  b.n(p+'m1','NAND',x+240,y);     b.n(p+'m2','NAND',x+240,y+80);
  b.n(p+'mq','NAND',x+380,y);     b.n(p+'mn','NAND',x+380,y+80);
  b.n(p+'s1','NAND',x+520,y);     b.n(p+'s2','NAND',x+520,y+80);
  b.n(p+'q','NAND',x+660,y);      b.n(p+'qn','NAND',x+660,y+80);
  b.w(ck,p+'nck',0); b.w(d,p+'nd',0);
  b.w(d,p+'m1',0); b.w(p+'nck',p+'m1',1); b.w(p+'nd',p+'m2',0); b.w(p+'nck',p+'m2',1);
  b.w(p+'m1',p+'mq',0); b.w(p+'mn',p+'mq',1); b.w(p+'m2',p+'mn',0); b.w(p+'mq',p+'mn',1);
  b.w(p+'mq',p+'s1',0); b.w(ck,p+'s1',1); b.w(p+'mn',p+'s2',0); b.w(ck,p+'s2',1);
  b.w(p+'s1',p+'q',0); b.w(p+'qn',p+'q',1); b.w(p+'s2',p+'qn',0); b.w(p+'q',p+'qn',1);
}
function fullAdder(b,p,x,y,a,bb,ci){      // zwraca nazwy: sumę i przeniesienie
  b.n(p+'x1','XOR',x+140,y+20); b.n(p+'x2','XOR',x+280,y+20);
  b.n(p+'a1','AND',x+140,y+100); b.n(p+'a2','AND',x+280,y+100); b.n(p+'o','OR',x+420,y+100);
  b.w(a,p+'x1',0); b.w(bb,p+'x1',1); b.w(p+'x1',p+'x2',0); b.w(ci,p+'x2',1);
  b.w(a,p+'a1',0); b.w(bb,p+'a1',1); b.w(p+'x1',p+'a2',0); b.w(ci,p+'a2',1);
  b.w(p+'a1',p+'o',0); b.w(p+'a2',p+'o',1);
}
// Licznik "kropka": rejestr przesuwny 10 x przerzutnik D, jedna jedynka. Zegar tyka tylko gdy wciśnięty jest przycisk,
// więc stopień nie potrzebuje członu "trzymaj": D[i] = (+ & Q[i-1]) | (- & Q[i+1]).
// wrap=true: pętla (10 -> 1, 1 -> 10), wrap=false: stopery na końcach (kropka zostaje).
function dotMake(b,wrap){
  const N=10, RH=170, Y=i=>(N-i)*RH;
  b.n('P','BTN',0,700,'+'); b.n('M','BTN',0,800,'-'); b.n('R','BTN',0,900,'R');
  // sterowanie: pp = + (bez R), mm = - (bez R i bez +)
  b.n('nr','NOT',140,960); b.n('z','NOR',140,760);
  b.n('pp','AND',260,700); b.n('mm','AND',260,820); b.n('pm','OR',400,760);
  b.w('R','nr',0); b.w('P','z',0); b.w('R','z',1); b.w('P','pp',0); b.w('nr','pp',1); b.w('M','mm',0); b.w('z','mm',1);
  b.w('pp','pm',0); b.w('mm','pm',1);
  // logika wejść D (dalej: zatrzaski master, zegar, zatrzaski slave) - kolejność tworzenia = kolejność obliczeń
  const D={};
  for(let i=1;i<=N;i++){
    const y0=Y(i), a=k=>'a'+k+'_'+i, o1='o1_'+i, o2='o2_'+i, u='u_'+i;
    if(!wrap && i===1){            // stoper na dole: D = (mm & (Q1|Q2)) | R
      b.n(u,'OR',760,y0+50); b.n(a(1),'AND',880,y0+50); b.n(o1,'OR',1000,y0+50);
      b.w('q_1',u,0); b.w('q_2',u,1); b.w('mm',a(1),0); b.w(u,a(1),1); b.w(a(1),o1,0); b.w('R',o1,1); D[i]=o1;
    } else if(!wrap && i===N){     // stoper na górze: D = pp & (Q9|Q10)
      b.n(u,'OR',760,y0+50); b.n(a(1),'AND',880,y0+50);
      b.w('q_'+(i-1),u,0); b.w('q_'+i,u,1); b.w('pp',a(1),0); b.w(u,a(1),1); D[i]=a(1);
    } else {                       // zwykły stopień; w pętli sąsiedzi są cykliczni
      const prev=i===1?N:i-1, next=i===N?1:i+1;
      b.n(a(1),'AND',760,y0); b.n(a(2),'AND',760,y0+50); b.n(o1,'OR',880,y0+25);
      b.w('pp',a(1),0); b.w('q_'+prev,a(1),1); b.w('mm',a(2),0); b.w('q_'+next,a(2),1); b.w(a(1),o1,0); b.w(a(2),o1,1); D[i]=o1;
      if(wrap && i===1){ b.n(o2,'OR',1000,y0+25); b.w(o1,o2,0); b.w('R',o2,1); D[i]=o2; }   // reset ustawia pozycję 1
    }
  }
  for(let i=1;i<=N;i++){   // zatrzaski master
    const y0=Y(i);
    b.n('nd_'+i,'NOT',1120,y0+110); b.n('m1_'+i,'NAND',1240,y0+30); b.n('m2_'+i,'NAND',1240,y0+90);
    b.n('mq_'+i,'NAND',1360,y0+30); b.n('mn_'+i,'NAND',1360,y0+90);
    b.w(D[i],'nd_'+i,0); b.w(D[i],'m1_'+i,0); b.w('nck','m1_'+i,1); b.w('nd_'+i,'m2_'+i,0); b.w('nck','m2_'+i,1);
    b.w('m1_'+i,'mq_'+i,0); b.w('mn_'+i,'mq_'+i,1); b.w('m2_'+i,'mn_'+i,0); b.w('mq_'+i,'mn_'+i,1);
  }
  b.n('ck','OR',520,1100); b.n('nck','NOT',640,1100);       // wspólny zegar: dowolny przycisk
  b.w('pm','ck',0); b.w('R','ck',1); b.w('ck','nck',0);
  for(let i=1;i<=N;i++){   // zatrzaski slave + dioda
    const y0=Y(i);
    b.n('s1_'+i,'NAND',1480,y0+30); b.n('s2_'+i,'NAND',1480,y0+90); b.n('q_'+i,'NAND',1600,y0+30); b.n('qn_'+i,'NAND',1600,y0+90);
    b.w('mq_'+i,'s1_'+i,0); b.w('ck','s1_'+i,1); b.w('mn_'+i,'s2_'+i,0); b.w('ck','s2_'+i,1);
    b.w('s1_'+i,'q_'+i,0); b.w('qn_'+i,'q_'+i,1); b.w('s2_'+i,'qn_'+i,0); b.w('q_'+i,'qn_'+i,1);
    b.n('led_'+i,'OUT',1740,y0+30,String(i)); b.w('q_'+i,'led_'+i,0);
  }
}
const dotAfter = m => { m.R.v=1; for(let k=0;k<6;k++) pass(); m.R.v=0; for(let k=0;k<6;k++) pass(); };   // impuls resetu zaraz po wczytaniu
const EXAMPLES = [
 {name:'Bramki podstawowe', desc:'Wszystkie bramki obok siebie, sterowane dwoma przełącznikami. Zacznij od klikania A i B.',
  make(b){
    b.n('A','IN',40,120,'A'); b.n('B','IN',40,300,'B');
    GATES.forEach((t,i)=>{ b.n('g'+i,t,240,20+i*80); b.n('o'+i,'OUT',400,20+i*80,t);
      b.w('A','g'+i,0); if(t!=='NOT') b.w('B','g'+i,1); b.w('g'+i,'o'+i,0); });
  }},
 {name:'NAND — bramka uniwersalna', desc:'NOT, AND i OR zbudowane wyłącznie z NAND-ów. Z NAND-ów da się zrobić wszystko.',
  make(b){
    b.n('A','IN',40,160,'A'); b.n('B','IN',40,280,'B');
    b.n('g1','NAND',200,40); b.n('o1','OUT',340,40,'NOT A'); b.w('A','g1',0); b.w('A','g1',1); b.w('g1','o1',0);
    b.n('g2','NAND',200,140); b.n('g3','NAND',320,140); b.n('o2','OUT',460,140,'AND');
    b.w('A','g2',0); b.w('B','g2',1); b.w('g2','g3',0); b.w('g2','g3',1); b.w('g3','o2',0);
    b.n('g4','NAND',200,260); b.n('g5','NAND',200,340); b.n('g6','NAND',340,300); b.n('o3','OUT',480,300,'OR');
    b.w('A','g4',0); b.w('A','g4',1); b.w('B','g5',0); b.w('B','g5',1); b.w('g4','g6',0); b.w('g5','g6',1); b.w('g6','o3',0);
  }},
 {name:'XOR z 4 × NAND', desc:'Klasyczny XOR w czterech NAND-ach. Spróbuj zrobić to samo z mniejszej liczby bramek innych typów.',
  make(b){

/* ================= STAN UI ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0,H=0, ox=0, oy=0;
let PIN_R = 10;
const isMobile = () => matchMedia('(max-width:820px),(pointer:coarse)').matches;
let lastClient = {x:0,y:0};
let tool = null, drag = null, mouse = {x:0,y:0}, hoverPin = null, paused = false;
let curEx = null;
const store = (k,v)=>{ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } };
const $ = id => document.getElementById(id);

function resize(){
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, isMobile()?2:3);
  W = r.width; H = r.height; cv.width = W*d; cv.height = H*d;
  ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize', resize);
new ResizeObserver(()=>resize()).observe(document.getElementById('main'));

/* ================= GEOMETRIA ================= */
const isSrc = n => n.type==='IN' || n.type==='BTN' || n.type==='CLK';
const nw = n => SIZE[n.type] ? SIZE[n.type][0] : ((isSrc(n)||n.type==='OUT') ? 40 : 60);
const nh = n => SIZE[n.type] ? SIZE[n.type][1] : 40;
function inPins(n){
  const c = IN_COUNT[n.type]||0, r=[];
  if (n.type==='MAT'){
    for (let k=0;k<10;k++) r.push({x:n.x,y:n.y+20+k*20});
    for (let j=0;j<10;j++) r.push({x:n.x+20+j*20,y:n.y+230,d:[0,1]});
    return r;
  }
  if (SIZE[n.type]){ for (let k=0;k<c;k++) r.push({x:n.x,y:n.y+20+k*20}); return r; }
  if (c===1) return [{x:n.x,y:n.y+20}];
  if (c===2) return [{x:n.x,y:n.y+10},{x:n.x,y:n.y+30}];
  return [];
}
function outPin(n){ return (n.type==='OUT'||SIZE[n.type]) ? null : {x:n.x+nw(n),y:n.y+20}; }
function pinAt(p){
  for (let i=nodes.length-1;i>=0;i--){
    const n=nodes[i], o=outPin(n);
    if (o && Math.hypot(o.x-p.x,o.y-p.y)<PIN_R) return {node:n,kind:'out',idx:0,x:o.x,y:o.y};
    const ps=inPins(n);
    for (let k=0;k<ps.length;k++) if (Math.hypot(ps[k].x-p.x,ps[k].y-p.y)<PIN_R) return {node:n,kind:'in',idx:k,x:ps[k].x,y:ps[k].y};
  }
  return null;
}
function nodeAt(p){
  for (let i=nodes.length-1;i>=0;i--){ const n=nodes[i];
    if (p.x>=n.x&&p.x<=n.x+nw(n)&&p.y>=n.y&&p.y<=n.y+nh(n)) return n; }
  return null;
}
function wirePts(w){
  const a=byId[w.from], b=byId[w.to]; if(!a||!b) return null;
  const p1=outPin(a), p2=inPins(b)[w.pin]; if(!p2) return null;
  const dx=Math.max(40,Math.abs(p2.x-p1.x)/2), d=p2.d||[-1,0], off=d[0]?dx:40;
  return [p1,{x:p1.x+dx,y:p1.y},{x:p2.x+d[0]*off,y:p2.y+d[1]*off},p2];
}
function bez(c,t){ const u=1-t;
  return {x:u*u*u*c[0].x+3*u*u*t*c[1].x+3*u*t*t*c[2].x+t*t*t*c[3].x,
          y:u*u*u*c[0].y+3*u*u*t*c[1].y+3*u*t*t*c[2].y+t*t*t*c[3].y}; }
function wireAt(p){
  for (let i=wires.length-1;i>=0;i--){
    const c=wirePts(wires[i]); if(!c) continue;
    for (let t=0;t<=1;t+=0.04){ const q=bez(c,t); if(Math.hypot(q.x-p.x,q.y-p.y)<7) return wires[i]; }
  }
  return null;
}

/* ================= EDYCJA ================= */
const snap = v => Math.round(v/20)*20;
const gateCount = () => nodes.filter(n=>GATES.includes(n.type)).length;
function addNode(type,x,y,label){
  const n={id:nextId++,type,x:snap(x),y:snap(y),v:0,t:0,stopped:false,src:[null,null],label:label||''};
  nodes.push(n); return n;
}
function connect(from,to,pin){
  wires = wires.filter(w=>!(w.to===to&&w.pin===pin));
  wires.push({from,to,pin}); rebuild(); changed();
}
function delNode(n){
  nodes = nodes.filter(m=>m!==n); wires = wires.filter(w=>w.from!==n.id&&w.to!==n.id);
  rebuild(); changed();
}
function delWire(w){ wires = wires.filter(x=>x!==w); rebuild(); changed(); }
function changed(){ store('lg_sandbox',snapshot()); renderInfo(); }
function snapshot(){ return {n:nodes.map(n=>({id:n.id,type:n.type,x:n.x,y:n.y,label:n.label})),w:wires.map(w=>({...w})),id:nextId}; }
function restore(s){
  nodes=s.n.map(n=>({...n,v:0,t:0,stopped:false,src:[null,null]})); wires=s.w.map(w=>({...w})); nextId=s.id; rebuild();
}
let zoom = 1;
function fitView(){
  if(!nodes.length){ ox=oy=0; zoom=1; return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of nodes){ x0=Math.min(x0,n.x-10); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+nw(n)+10); y1=Math.max(y1,n.y+nh(n)+14); }
  const bw=x1-x0, bh=y1-y0;
  zoom = Math.max(0.25,Math.min(1,(W-50)/bw,(H-50)/bh));
  ox = Math.round((W-bw*zoom)/2 - x0*zoom); oy = Math.round((H-bh*zoom)/2 - y0*zoom);
}
function zoomBy(k,cx,cy){
  cx = cx===undefined ? W/2 : cx; cy = cy===undefined ? H/2 : cy;
  const nz=Math.max(0.2,Math.min(3,zoom*k)), wx=(cx-ox)/zoom, wy=(cy-oy)/zoom;
  zoom=nz; ox=cx-wx*nz; oy=cy-wy*nz;
}
function loadExample(i){
  store('lg_prev',snapshot());
  const e=EXAMPLES[i]; nodes=[];wires=[];nextId=1;
  const m={}, pend=[];
  e.make({ n(name,type,x,y,label,v){ m[name]=addNode(type,x,y,label); if(v) m[name].v=v; }, w(a,b,pin){ pend.push([a,b,pin]); } });
  for(const [a,b,pin] of pend){ if(!m[a]||!m[b]) throw new Error('zły kabel '+a+'>'+b+' w '+e.name);
    wires.push({from:m[a].id,to:m[b].id,pin}); }
  rebuild(); curEx=i; fitView(); changed(); renderPalette();
  for(let k=0;k<30;k++) pass();
  if(e.after){ e.after(m); for(let k=0;k<30;k++) pass(); }
}
function clearAll(){ store('lg_prev',snapshot()); nodes=[];wires=[];nextId=1;curEx=null;rebuild();changed(); }
function undoLoad(){ const s=store('lg_prev'); if(!s) return; store('lg_prev',snapshot()); restore(s); curEx=null; changed(); }

function download(blob,name){
  if (window.LLNative){   // Android app: save through the native bridge (MediaStore)
    const r=new FileReader();
    r.onload=()=>window.LLNative.saveFile(name,blob.type||'application/octet-stream',String(r.result).split(',')[1]||'');
    r.readAsDataURL(blob); return;
  } const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function saveFile(){ download(new Blob([JSON.stringify({format:'logiclab',...snapshot()})],{type:'application/json'}),'uklad.logiclab.json'); }
function openFile(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,.logiclab';
  i.onchange=()=>{ const f=i.files[0]; if(!f) return; f.text().then(t=>{ try{ const s=JSON.parse(t);
      if(!s.n||!s.w) throw 0; store('lg_prev',snapshot()); restore(s); curEx=null; fitView(); changed(); renderPalette(); }
    catch(e){ dlg('Błąd','<p>Nie udało się wczytać pliku — to nie wygląda na układ LogicLab.</p>'); } }); };
  i.click();
}

/* ================= RYSOWANIE ================= */
const COL={NOT:'#2f9e5f',AND:'#d9822b',OR:'#2a9fb0',XOR:'#b8458f',NAND:'#d65a45',NOR:'#8fa82e'};
const sigCol = v => v?'#ffd23f':'#44536f';
function shade(hex,a){ const n=parseInt(hex.slice(1),16), f=v=>Math.max(0,Math.min(255,v+a));
  return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; }
function glossRect(x,y,w,h,r,base){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,shade(base,70)); g.addColorStop(.48,shade(base,20)); g.addColorStop(.52,shade(base,-15)); g.addColorStop(1,shade(base,-45));
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.lineWidth=1.3; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(x+1.5,y+1.5,w-3,h-3,Math.max(1,r-1.5)); ctx.stroke();
}
function bezel(n){
  const g=ctx.createLinearGradient(0,n.y,0,n.y+40);
  g.addColorStop(0,'#fbfcfe'); g.addColorStop(.5,'#c5ccd8'); g.addColorStop(1,'#8892a3');
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(n.x,n.y,40,40,9); ctx.fill();
  ctx.strokeStyle='#222a38'; ctx.lineWidth=1.3; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(n.x+1.5,n.y+1.5,37,37,8); ctx.stroke();
}
function sphere(cx,cy,r,hi,mid,lo,glow){
  if (glow){ const hg=ctx.createRadialGradient(cx,cy,r*.5,cx,cy,r*2.1); hg.addColorStop(0,glow+'99'); hg.addColorStop(1,glow+'00');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(cx,cy,r*2.1,0,7); ctx.fill(); }
  const g=ctx.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r);
  g.addColorStop(0,hi); g.addColorStop(.55,mid); g.addColorStop(1,lo);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(cx-r*.25,cy-r*.45,r*.5,r*.28,-.4,0,7); ctx.fill();
}
const HEXSEG=[0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F,0x77,0x7C,0x39,0x5E,0x79,0x71];
function digit(x0,y0,bw,bh,mask,on,off,dp){
  const t=Math.max(3,bw*0.17), mid=y0+bh/2, hl=bw-t*1.5, vl=bh/2-t*1.3;
  const hs=(cx,cy,len)=>{ const l=len/2; ctx.beginPath(); ctx.moveTo(cx-l,cy); ctx.lineTo(cx-l+t*.6,cy-t/2); ctx.lineTo(cx+l-t*.6,cy-t/2); ctx.lineTo(cx+l,cy); ctx.lineTo(cx+l-t*.6,cy+t/2); ctx.lineTo(cx-l+t*.6,cy+t/2); ctx.closePath(); };
  const vs=(cx,cy,len)=>{ const l=len/2; ctx.beginPath(); ctx.moveTo(cx,cy-l); ctx.lineTo(cx+t/2,cy-l+t*.6); ctx.lineTo(cx+t/2,cy+l-t*.6); ctx.lineTo(cx,cy+l); ctx.lineTo(cx-t/2,cy+l-t*.6); ctx.lineTo(cx-t/2,cy-l+t*.6); ctx.closePath(); };
  const P=[[hs,x0+bw/2,y0+t/2,hl],[vs,x0+bw-t/2,y0+bh/4,vl],[vs,x0+bw-t/2,y0+bh*3/4,vl],[hs,x0+bw/2,y0+bh-t/2,hl],
           [vs,x0+t/2,y0+bh*3/4,vl],[vs,x0+t/2,y0+bh/4,vl],[hs,x0+bw/2,mid,hl]];
  P.forEach((p,i)=>{ const lit=(mask>>i)&1; p[0](p[1],p[2],p[3]);
    ctx.fillStyle=lit?on:off; ctx.fill(); });
  if (dp!==undefined){ const lit=dp; ctx.beginPath(); ctx.arc(x0+bw+t*.9,y0+bh-t*.4,t*.5,0,7);
    ctx.fillStyle=lit?on:off; ctx.fill(); }
}
function drawDisplay(n){
  const w=nw(n), h=nh(n);
  const g=ctx.createLinearGradient(0,n.y,0,n.y+h); g.addColorStop(0,'#4a5262'); g.addColorStop(.5,'#2b313d'); g.addColorStop(1,'#161a22');
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(n.x,n.y,w,h,8); ctx.fill();
  ctx.strokeStyle='#05070a'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(n.x+1.5,n.y+1.5,w-3,h-3,7); ctx.stroke();
  const label=(txt,x,y,al)=>{ ctx.fillStyle='#b9c6dc'; ctx.font='9px "Segoe UI",sans-serif'; ctx.textAlign=al||'left'; ctx.fillText(txt,x,y); };
  const screen=(x,y,ww,hh)=>{ ctx.fillStyle='#050607'; ctx.beginPath(); ctx.roundRect(x,y,ww,hh,4); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fillRect(x+1,y+1,ww-2,hh/2); };
  const RED='#ff3b30', REDOFF='#2b1210';
  if (n.type==='SEG7'){
    ['a','b','c','d','e','f','g','dp'].forEach((l,k)=>label(l,n.x+7,n.y+20+k*20));
    screen(n.x+26,n.y+12,w-34,h-24);
    let m=0; for(let k=0;k<7;k++) m|=srcVal(n,k)<<k;
    digit(n.x+40,n.y+36,38,108,m,RED,REDOFF,srcVal(n,7));
  } else if (n.type==='HEX7'){
    ['8','4','2','1'].forEach((l,k)=>label(l,n.x+8,n.y+20+k*20));
    screen(n.x+24,n.y+10,w-30,h-20);
    let v=0; for(let k=0;k<4;k++) v|=srcVal(n,k)<<(3-k);
    digit(n.x+34,n.y+22,28,56,HEXSEG[v],RED,REDOFF);
  } else if (n.type==='NUM'){
    ['128','64','32','16','8','4','2','1'].forEach((l,k)=>label(l,n.x+6,n.y+20+k*20));
    screen(n.x+34,n.y+12,w-42,h-24);
    let v=0; for(let k=0;k<8;k++) v|=srcVal(n,k)<<(7-k);
    const AMB='#ffb300', AMBOFF='#2a1e08', ds=[Math.floor(v/100),Math.floor(v/10)%10,v%10];
    ds.forEach((d,i)=>{ const blank = (i===0&&v<100)||(i===1&&v<10); digit(n.x+42+i*33,n.y+26,26,56,blank?0:HEXSEG[d],AMB,AMBOFF); });
    label('HEX '+v.toString(16).toUpperCase().padStart(2,'0'),n.x+40,n.y+112);
    label('BIN '+v.toString(2).padStart(8,'0'),n.x+40,n.y+128);
  } else if (n.type==='MAT'){
    screen(n.x+10,n.y+10,200,210);
    for(let r=0;r<10;r++) for(let c=0;c<10;c++){
      const lit=srcVal(n,r)&srcVal(n,10+c), cx=n.x+20+c*20, cy=n.y+20+r*20;
      ctx.fillStyle=lit?'#ff5a40':'#2b1512'; ctx.beginPath(); ctx.arc(cx,cy,7,0,7); ctx.fill();
      if(lit){ ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(cx-2,cy-2,2.2,0,7); ctx.fill(); }
    }
    for(let c=0;c<10;c++) label('C'+c,n.x+20+c*20,n.y+h-6,'center');
    label('wiersze R0–R9 ◄',n.x+14,n.y-4);
  }
}
function drawNode(n){
  const h=40, cx=n.x+20, cy=n.y+20;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if (n.type==='IN'){
    bezel(n);
    ctx.fillStyle=n.v?'#2f9e3f':'#3a4050'; ctx.beginPath(); ctx.roundRect(n.x+7,n.y+13,26,14,7); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.roundRect(n.x+8,n.y+14,24,5,3); ctx.fill();
    sphere(n.v?n.x+27:n.x+13,cy,6,'#ffffff','#cfd6e2','#7d889a');
  } else if (n.type==='BTN'){
    bezel(n);
    if (n.v) sphere(cx,cy+1,11,'#ffe9a8','#ffd23f','#b87a00','#ffd23f');
    else sphere(cx,cy,11,'#ff9a8a','#d13a2a','#6e1208');
  } else if (n.type==='OUT'){
    bezel(n);
    if (n.v) sphere(cx,cy,11,'#fffbe0','#ffd23f','#c98a00','#ffd23f');
    else sphere(cx,cy,11,'#6c5c80','#2c2338','#120e18');
  } else if (n.type==='CLK'){
    bezel(n);
    ctx.fillStyle='#08150c'; ctx.beginPath(); ctx.roundRect(n.x+5,n.y+7,30,22,3); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle=n.stopped?'#6b3a3a':(n.v?'#7dff98':'#2f8f48'); ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(n.x+8,n.y+24); ctx.lineTo(n.x+8,n.y+12); ctx.lineTo(n.x+20,n.y+12); ctx.lineTo(n.x+20,n.y+24); ctx.lineTo(n.x+32,n.y+24); ctx.lineTo(n.x+32,n.y+12); ctx.stroke();
    ctx.fillStyle=n.stopped?'#ff6b6b':'#2f8f48'; ctx.font='bold 7px Consolas,monospace'; ctx.fillText(n.stopped?'STOP':'RUN',cx,n.y+34);
  } else if (SIZE[n.type]){ drawDisplay(n);
  } else {
    const w=60, inv=(n.type==='NOT'||n.type==='NAND'||n.type==='NOR'), bw=inv?w-8:w;
    glossRect(n.x,n.y,bw,h,7,COL[n.type]);
    if (inv){ const g=ctx.createRadialGradient(n.x+bw+3,n.y+18,1,n.x+bw+4,n.y+20,5.5); g.addColorStop(0,'#fff'); g.addColorStop(1,'#aab4c4');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x+bw+4,n.y+20,4.6,0,7); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.7)'; ctx.lineWidth=1.2; ctx.stroke(); }
    ctx.font='bold 12px "Segoe UI",sans-serif';
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillText(n.type,n.x+bw/2+1,n.y+21);
    ctx.fillStyle='#fff'; ctx.fillText(n.type,n.x+bw/2,n.y+20);
  }
  if (n.label && (isSrc(n)||n.type==='OUT')){
    ctx.fillStyle='#d3deef'; ctx.font='11px "Segoe UI",sans-serif'; ctx.textAlign='center'; ctx.fillText(n.label,n.x+20,n.y+h+10);
  }
  inPins(n).forEach((p,k)=>pin(p.x,p.y,sigCol(srcVal(n,k))));
  const o=outPin(n); if(o) pin(o.x,o.y,sigCol(n.v));
}
function pin(x,y,c){
  ctx.fillStyle='#161b24'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,3.4,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x,y,5,3.4,5.6); ctx.stroke();
}
function strokeWire(c){ ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y); ctx.bezierCurveTo(c[1].x,c[1].y,c[2].x,c[2].y,c[3].x,c[3].y); ctx.stroke(); }
let lastSig='';
function sigNow(){   // cheap fingerprint of everything the picture depends on
  let h=0;
  for (const n of nodes) h=(h*31 + n.id*7 + (n.x|0)*3 + (n.y|0)*5 + n.v*2 + (n.stopped?1:0))|0;
  for (const w of wires) h=(h*17 + w.from*13 + w.to*5 + w.pin)|0;
  return h+'|'+nodes.length+'|'+wires.length+'|'+(ox|0)+','+(oy|0)+','+zoom.toFixed(3)+'|'+W+','+H+'|'+showGrid+'|'+(tool||'')+'|'+paused+'|'+
    ((tool||(drag&&drag.type==='wire'))?(mouse.x|0)+','+(mouse.y|0):'')+'|'+(hoverPin?hoverPin.x+','+hoverPin.y:'');
}
function draw(){
  const sg=sigNow();
  if (sg===lastSig){ requestAnimationFrame(draw); return; }
  lastSig=sg;
  const vx0=-ox/zoom-80, vx1=(W-ox)/zoom+80, vy0=-oy/zoom-80, vy1=(H-oy)/zoom+80;
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#1c2636'); bg.addColorStop(1,'#0e141d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(ox,oy); ctx.scale(zoom,zoom);
  if (showGrid){
    ctx.fillStyle='#26324a';
    const x0=Math.floor(-ox/zoom/20)*20, y0=Math.floor(-oy/zoom/20)*20, x1=(-ox+W)/zoom+20, y1=(-oy+H)/zoom+20;
    for (let x=x0;x<x1;x+=20) for (let y=y0;y<y1;y+=20) ctx.fillRect(x-1,y-1,2,2);
  }
  ctx.lineCap='round';
  for (const w of wires){ const c=wirePts(w); if(!c) continue;
    if (Math.max(c[0].x,c[1].x,c[2].x,c[3].x)<vx0 || Math.min(c[0].x,c[1].x,c[2].x,c[3].x)>vx1 ||
        Math.max(c[0].y,c[1].y,c[2].y,c[3].y)<vy0 || Math.min(c[0].y,c[1].y,c[2].y,c[3].y)>vy1) continue;
    const on=byId[w.from].v;
    if (on){ ctx.lineWidth=9; ctx.strokeStyle='rgba(255,184,0,.22)'; strokeWire(c); }
    ctx.lineWidth=5.5; ctx.strokeStyle='rgba(0,0,0,.55)'; strokeWire(c);
    ctx.lineWidth=3; ctx.strokeStyle=sigCol(on);
    strokeWire(c); }
  for (const n of nodes){ if (n.x+nw(n)<vx0 || n.x>vx1 || n.y+nh(n)<vy0 || n.y>vy1) continue; drawNode(n); }
  const mp={x:(mouse.x-ox)/zoom,y:(mouse.y-oy)/zoom};
  if (drag && drag.type==='wire'){
    const a=drag.pin, bx=hoverPin?hoverPin.x:mp.x, by=hoverPin?hoverPin.y:mp.y, dx=40, s=a.kind==='out'?1:-1;
    ctx.lineWidth=3; ctx.strokeStyle='#5ec8ff'; ctx.setLineDash([6,5]);
    strokeWire([{x:a.x,y:a.y},{x:a.x+dx*s,y:a.y},{x:bx-dx*s,y:by},{x:bx,y:by}]); ctx.setLineDash([]);
  }
  if (hoverPin){ ctx.strokeStyle='#5ec8ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hoverPin.x,hoverPin.y,9,0,7); ctx.stroke(); }
  if (tool && !drag){
    ctx.globalAlpha=.55; drawNode({type:tool,x:snap(mp.x-nw({type:tool})/2),y:snap(mp.y-20),v:0,src:[null,null],label:''}); ctx.globalAlpha=1;
  }
  ctx.restore();
  $('hint').textContent = (paused ? '⏸ PAUZA   ' : '') + (tool ? 'Dotknij płaszczyzny: '+(PNAME[tool]||tool) : '');
  updateStatus();
  requestAnimationFrame(draw);
}

/* ================= MYSZ / KLAWIATURA ================= */
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
cv.style.touchAction='none';
const ptrs=new Map(); let pinch=null, longT=null;
function worldOf(s){ return {x:(s.x-ox)/zoom,y:(s.y-oy)/zoom}; }
function rightClickAt(p){   // right mouse button: delete what is under the pointer / drop the tool
  if (tool){ tool=null; renderPalette(); return; }
  const pn=pinAt(p);
  if (pn && pn.kind==='in'){ const w=wires.find(w=>w.to===pn.node.id&&w.pin===pn.idx); if(w){delWire(w);return;} }
  const n=nodeAt(p);
  if (n) delNode(n); else { const w=wireAt(p); if (w) delWire(w); }
}
function placeAt(p){
  const typ=tool; if(!typ) return; let label='';
  const cnt=t=>nodes.filter(n=>n.type===t).length;
  if (typ==='IN') label=String.fromCharCode(65+cnt('IN')%26);
  if (typ==='OUT') label='Q'+(cnt('OUT')||'');
  if (typ==='CLK') label='CLK';
  if (typ==='BTN') label='BTN'+(cnt('BTN')||'');
  addNode(typ,p.x-nw({type:typ})/2,p.y-20,label); rebuild(); changed();
}
function startDrag(s,p){
  const pn=pinAt(p), n=nodeAt(p);
  // big touch hit area: inside an element's body only a touch right on the pin starts a wire
  if (pn && !(n && Math.hypot(pn.x-p.x,pn.y-p.y)>10)){ drag={type:'wire',pin:pn,sx:s.x,sy:s.y}; return; }
  if (n){ if (n.type==='BTN') n.v=1; drag={type:'node',n,dx:p.x-n.x,dy:p.y-n.y,moved:false,sx:s.x,sy:s.y}; return; }
  drag={type:'pan',sx:s.x,sy:s.y,ox,oy};
}
function cancelGesture(){
  clearTimeout(longT);
  if (drag && drag.type==='node' && drag.n.type==='BTN') drag.n.v=0;
  drag=null; hoverPin=null;
}
function showCtx(cx,cy,items){   // small popup (reuses the dropdown) for the long-press actions
  closeMenu(); openMenu='ctx';
  const dd=$('dd'); dd.innerHTML='';
  items.forEach(it=>{ const d=document.createElement('div'); d.className='mi'; d.innerHTML=`<span class="ck"></span><span>${it.t}</span><span class="ac"></span>`;
    d.onpointerdown=e=>e.stopPropagation(); d.onclick=()=>{ closeMenu(); it.f(); }; dd.appendChild(d); });
  dd.style.display='block';
  const r=dd.getBoundingClientRect();
  dd.style.left=Math.max(4,Math.min(innerWidth-r.width-4,cx))+'px'; dd.style.top=Math.max(4,Math.min(innerHeight-r.height-4,cy))+'px';
}
function longPress(){
  if (!drag || ptrs.size!==1) return;
  if (Math.hypot(mouse.x-drag.sx,mouse.y-drag.sy)>10) return;
  const p=worldOf(mouse); cancelGesture();
  if (navigator.vibrate) navigator.vibrate(25);
  if (tool){ tool=null; renderPalette(); return; }
  const pn=pinAt(p), n=pn?pn.node:nodeAt(p);
  if (n){
    const items=[];
    if (wires.some(w=>w.to===n.id)) items.push({t:'Odłącz wejścia',f:()=>{ wires=wires.filter(w=>w.to!==n.id); rebuild(); changed(); }});
    items.push({t:'Usuń element',f:()=>delNode(n)}); items.push({t:'Anuluj',f:()=>{}});
    showCtx(lastClient.x,lastClient.y,items); return;
  }
  const w=wireAt(p);
  if (w) showCtx(lastClient.x,lastClient.y,[{t:'Usuń kabel',f:()=>delWire(w)},{t:'Anuluj',f:()=>{}}]);
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const s=pos(e), touch=e.pointerType!=='mouse';
  mouse=s; lastClient={x:e.clientX,y:e.clientY};
  PIN_R = touch ? Math.max(12,18/zoom) : 10;
  ptrs.set(e.pointerId,s);
  if (touch && ptrs.size===2){   // two fingers: pinch-zoom + pan
    cancelGesture();
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,z:zoom,ox,oy};
    return;
  }
  if (ptrs.size>1) return;
  const p=worldOf(s);
  if (e.button===2){ rightClickAt(p); return; }
  if (tool){
    if (!touch){ placeAt(p); return; }
    drag={type:'place',sx:s.x,sy:s.y};   // placed on release, so a pinch can't drop a stray element
  } else startDrag(s,p);
  if (touch){ clearTimeout(longT); longT=setTimeout(longPress,520); }
});
cv.addEventListener('pointermove',e=>{
  const s=pos(e); mouse=s; lastClient={x:e.clientX,y:e.clientY};
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId,s);
  if (pinch && ptrs.size>=2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y)||1, cxn=(a.x+b.x)/2, cyn=(a.y+b.y)/2;
    const nz=Math.max(0.2,Math.min(3,pinch.z*d/pinch.d)), wx=(pinch.cx-pinch.ox)/pinch.z, wy=(pinch.cy-pinch.oy)/pinch.z;
    zoom=nz; ox=cxn-wx*nz; oy=cyn-wy*nz; return;
  }
  const p=worldOf(s);
  if (drag && drag.type==='place' && Math.hypot(s.x-drag.sx,s.y-drag.sy)>10) drag={type:'pan',sx:drag.sx,sy:drag.sy,ox:ox,oy:oy};
  if (drag && drag.type==='node'){
    if (Math.hypot(mouse.x-drag.sx,mouse.y-drag.sy)>4) drag.moved=true;
    if (drag.moved){ clearTimeout(longT); drag.n.x=snap(p.x-drag.dx); drag.n.y=snap(p.y-drag.dy); }
  } else if (drag && drag.type==='pan'){ clearTimeout(longT); ox=drag.ox+mouse.x-drag.sx; oy=drag.oy+mouse.y-drag.sy; }
  else if (drag && drag.type==='wire' && Math.hypot(mouse.x-drag.sx,mouse.y-drag.sy)>6) clearTimeout(longT);
  const hp=pinAt(p);
  hoverPin = (drag&&drag.type==='wire') ? (hp&&hp.kind!==drag.pin.kind?hp:null) : hp;
  cv.style.cursor = drag&&drag.type==='pan' ? 'grabbing' : (hp?'pointer':(nodeAt(p)?'move':'crosshair'));
});
function endPtr(e){
  ptrs.delete(e.pointerId); clearTimeout(longT);
  if (pinch){ if (ptrs.size<2) pinch=null; if (ptrs.size===0) drag=null; return; }
  if (!drag) return;
  const p=worldOf(mouse);
  if (drag.type==='wire'){
    const t=pinAt(p), a=drag.pin;
    if (t && t.kind!==a.kind){
      const o=a.kind==='out'?a:t, i=a.kind==='in'?a:t;
      connect(o.node.id,i.node.id,i.idx);
    }
  } else if (drag.type==='node'){
    if (drag.n.type==='BTN') drag.n.v=0;
    if (!drag.moved){ if (drag.n.type==='IN') drag.n.v^=1; else if (drag.n.type==='CLK') drag.n.stopped=!drag.n.stopped; }
    else changed();
  } else if (drag.type==='place') placeAt(worldOf({x:drag.sx,y:drag.sy}));
  drag=null; hoverPin=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); cancelGesture(); if(ptrs.size<2) pinch=null; });
window.addEventListener('keydown',e=>{
  if (e.key==='Escape'){ closeMenu(); $('dlgbg').style.display='none'; tool=null; renderPalette(); return; }
  if (e.ctrlKey){
    const k=e.key.toLowerCase();
    if (k==='s'){ e.preventDefault(); saveFile(); } else if (k==='o'){ e.preventDefault(); openFile(); }
    else if (k==='n'){ e.preventDefault(); clearAll(); renderPalette(); } else if (k==='z'){ e.preventDefault(); undoLoad(); renderPalette(); }
    else if (k==='0'){ e.preventDefault(); fitView(); }
    return;
  }
  if (e.key==='F1'){ e.preventDefault(); helpDlg(); }
  else if (e.key===' '){ paused=!paused; renderToolbar(); e.preventDefault(); }
  else if (e.key==='.') pass();
  else if (/^[0-9]$/.test(e.key)){ const t=PAL[(+e.key+9)%10]; if(t) pickTool(t); }
  else if (e.key==='Delete'){
    const p={x:(mouse.x-ox)/zoom,y:(mouse.y-oy)/zoom}, n=nodeAt(p); if(n) delNode(n); else { const w=wireAt(p); if(w) delWire(w); }
  }
});

cv.addEventListener('wheel',e=>{ e.preventDefault(); const p=pos(e); zoomBy(e.deltaY<0?1.15:1/1.15,p.x,p.y); },{passive:false});

/* ================= START ================= */
setSpeed(60);
if (isMobile()){ $('left').style.display='none'; $('right').style.display='none'; }
$('left').addEventListener('click',e=>{ if(isMobile() && e.target.closest('.item')) $('left').style.display='none'; });
window.llBack=function(){   // Android back button: close the topmost thing
  if ($('dlgbg').style.display==='flex'){ $('dlgbg').style.display='none'; return true; }
  if (openMenu){ closeMenu(); return true; }
  for (const id of ['left','right']) if (isMobile() && $(id).style.display!=='none'){ $(id).style.display='none'; return true; }
  if (tool){ tool=null; renderPalette(); return true; }
  return false;
};
resize();
const saved = store('lg_sandbox');
if (saved && saved.n && saved.n.length) { restore(saved); fitView(); } else loadExample(0);
renderPalette(); renderInfo(); renderToolbar(); requestAnimationFrame(draw);
</script>
