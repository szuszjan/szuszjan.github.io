plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.szuszjan.irmusic'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.szuszjan.irmusic'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
